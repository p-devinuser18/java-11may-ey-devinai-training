  # ===========================================================================
  # Always-on meta-check.
  # Branch protection rules can require "ci-meta" as a required check.
  # Per-participant jobs are gated by branch name (above), so they show
  # "Skipped" on other participants' PRs. A "Skipped" status will NOT
  # satisfy "Required" branch protection — but ci-meta always passes,
  # so use it as your required check.
  # ===========================================================================
  ci-meta:
    name: CI · meta (always passes)
    runs-on: ubuntu-latest
    steps:
      - name: Identify which participant ran
        run: |
          echo "Workflow:    ${{ github.workflow }}"
          echo "Event:       ${{ github.event_name }}"
          echo "Head ref:    ${{ github.head_ref }}"
          echo "Base ref:    ${{ github.base_ref }}"
          echo "Actor:       ${{ github.actor }}"
