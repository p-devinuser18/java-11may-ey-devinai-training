# ============================================================================
# Devin AI Training — Monorepo CI
# ============================================================================
#
# This workflow runs ONE per-participant job for each PR, filtered by the
# branch name. Only the participant whose branch is being PR'd will see
# their CI job actually execute; the other 23 jobs are skipped (you'll
# see "Skipped" in the Checks panel, which is normal).
#
# WHY THIS STRUCTURE
# ------------------
# 24 trainees, 1 repo, 1 workflow file. If everyone appends their own job
# we get 24 simultaneous merge conflicts in this file. So we pre-populate
# 24 stubs — one block per participant — and Lab 24 becomes "fill in your
# stub", not "write a new job from scratch".
#
# LAB 24 INSTRUCTIONS — PARTICIPANT VIEW
# --------------------------------------
# Find the block labeled "devinuser<YOUR_NUMBER>" below. The block has
# three TODOs. Complete each on your hardening branch
# (devinuser<N>/hardening), open a PR against devinuser<N>/integration,
# and watch your job run.
#
#   TODO #1  Enable Maven dependency caching (cuts ~90s off every run)
#   TODO #2  Add a job-summary step describing your build
#   TODO #3  (Optional) Upload test reports as a workflow artifact
#
# You MUST NOT edit any other participant's block. If your edits touch
# lines outside the delimiter comments for your own block, the instructor
# will reject the PR.
#
# DOES MY JOB RUN?
# ----------------
# Your job runs when the PR head branch starts with "devinuser<N>/".
# That means any PR from devinuser<N>/scaffold, devinuser<N>/crud-jpa,
# devinuser<N>/tests-service, devinuser<N>/tests-controller, or
# devinuser<N>/hardening triggers your job — and only yours.
# ============================================================================

name: CI — Monorepo Per-Participant

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main']

# Cancel in-flight runs on the same branch when a new commit arrives.
# This stops 5-min Maven builds from stacking up.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # >>>>>>>>>>>>>>>>>>>>>>>>>  BEGIN devinuser1  <<<<<<<<<<<<<<<<<<<<<<<<<
  # Owner: devinuser1@meteoros.ai
  # Triggers on:  head ref starts with "devinuser1/"  (any feature/integration branch)
  # Builds:       apps/devinuser1/
  # ===========================================================================
  ci-devinuser1:
    name: CI · devinuser1
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'devinuser1/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/devinuser1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Lab 24 — TODO #1  (required)
      # Enable Maven dependency caching. Without this, every run re-downloads
      # ~50MB of dependencies from Maven Central (~90s wasted).
      #
      # Add ONE line below the "distribution:" line:
      #
      #     cache: 'maven'
      #
      # Verify after merging by checking the "Set up JDK 17" step logs — you
      # should see "Cache restored" or "Cache saved" messages.
      # ---------------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # cache: '____'    ← TODO #1: add this line

      - name: Build and test
        run: mvn -B clean verify

      # ---------------------------------------------------------------------
      # Lab 24 — TODO #2  (required)
      # Append a markdown summary to $GITHUB_STEP_SUMMARY so the GitHub
      # Actions UI shows a friendly summary of your build at a glance.
      #
      # Add a step here that:
      #   - runs even when tests fail (use:  if: always())
      #   - writes at least these lines to $GITHUB_STEP_SUMMARY:
      #       ### CI summary — devinuser1
      #       - Branch: `$GITHUB_HEAD_REF`
      #       - PR base: `$GITHUB_BASE_REF`
      #       - App folder: `apps/devinuser1`
      #
      # Hint: a "run" step with multiple "echo ... >> $GITHUB_STEP_SUMMARY"
      # lines is the simplest form.
      #
      # ADD YOUR STEP BELOW THIS COMMENT BLOCK:
      # ---------------------------------------------------------------------

      # ---------------------------------------------------------------------
      # Lab 24 — TODO #3  (optional — only if you finish #1 and #2 with time)
      # Upload target/surefire-reports/ as a workflow artifact so failing
      # test XML/HTML reports are downloadable from the run's summary page.
      #
      # Use actions/upload-artifact@v4. Suggested artifact name:
      #     test-results-devinuser1
      # Path:
      #     target/surefire-reports/
      # Must run on failure too:
      #     if: always()
      #
      # ADD YOUR STEP BELOW THIS COMMENT BLOCK:
      # ---------------------------------------------------------------------

  # >>>>>>>>>>>>>>>>>>>>>>>>>   END devinuser1   <<<<<<<<<<<<<<<<<<<<<<<<<

